name: release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionName reads the tag and the commit count
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        env:
          KEYSTORE: ${{ secrets.MM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No keystore secret; building an unsigned release."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build arm64 APK
        env:
          MM_STORE_FILE: ${{ secrets.MM_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          MM_STORE_PASSWORD: ${{ secrets.MM_STORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.MM_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.MM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${MM_STORE_FILE:-}" ]; then
            ARGS=(
              -PMM_STORE_FILE="$MM_STORE_FILE"
              -PMM_STORE_PASSWORD="$MM_STORE_PASSWORD"
              -PMM_KEY_ALIAS="$MM_KEY_ALIAS"
              -PMM_KEY_PASSWORD="$MM_KEY_PASSWORD"
            )
          fi
          ./gradlew assembleRelease "${ARGS[@]}"
          SRC=androidApp/build/outputs/apk/release/app-arm64-v8a-release.apk
          cp "$SRC" "MediaManager-${GITHUB_REF_NAME}-arm64.apk"

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: MediaManager-${{ github.ref_name }}-arm64.apk
          draft: true
