name: mediamanager

services:
  api:
    image: ${IMAGE_PREFIX}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      MM_BIND: 0.0.0.0:8787
      MM_LIBRARY_DIR: /library
    volumes:
      - ./library:/library
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_PREFIX}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"

  # Optional TLS terminator. Point media.example.com at this host, then run
  # with `--profile tls` and set PUBLIC_HOST below.
  caddy:
    image: caddy:2
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-media.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
