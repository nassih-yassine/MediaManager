<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MediaManager — server unreachable</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0c0f;
        color: #e7ece9;
        font-family: "Noto Sans", system-ui, -apple-system, sans-serif;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        border: 1px solid #263039;
        border-radius: 18px;
        background: #12171d;
        padding: 28px;
      }
      .mark {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #0a0c0f;
        display: grid;
        place-items: center;
      }
      h1 { margin: 18px 0 6px; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0; color: #93a0a8; line-height: 1.6; font-size: 14px; }
      code {
        display: block;
        margin: 14px 0;
        padding: 10px 12px;
        border: 1px solid #263039;
        border-radius: 10px;
        background: #0a0c0f;
        color: #9ae6b4;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .row { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
      button, a.btn {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        background: #9ae6b4;
        color: #08120c;
      }
      a.btn.secondary {
        background: transparent;
        color: #93a0a8;
        border: 1px solid #263039;
      }
      .hint { margin-top: 16px; font-size: 12px; color: #6e7b84; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg viewBox="0 0 512 512" width="30" height="30" aria-hidden="true">
          <rect width="512" height="512" rx="116" fill="#0a0c0f" />
          <path d="M171 146 341 256 171 366Z" fill="#9ae6b4" stroke="#9ae6b4" stroke-width="28" stroke-linejoin="round" />
        </svg>
      </div>
      <h1>Can’t reach the MediaManager server</h1>
      <p>
        The desktop app loads the library from your local server. Start it, then
        retry — this page also checks again automatically.
      </p>
      <code id="server">http://localhost:3001</code>
      <p>Start it with:</p>
      <code>systemctl --user start mm-api mm-web</code>
      <div class="row">
        <button id="retry" type="button">Retry now</button>
        <a class="btn secondary" id="browser" href="#">Open in browser</a>
      </div>
      <p class="hint">
        Using the dev setup? Run <code style="display:inline;padding:2px 6px">make dev</code>.
      </p>
    </div>
    <script>
      const server =
        window.__MM_SERVER__ ||
        new URLSearchParams(location.search).get("server") ||
        "http://localhost:3001";
      document.getElementById("server").textContent = server;
      document.getElementById("browser").href = server;

      function go() {
        location.replace(server);
      }
      document.getElementById("retry").addEventListener("click", go);

      // A no-cors request resolves when the server answers, even though the
      // response is opaque. It lets the page recover without a click.
      async function probe() {
        try {
          await fetch(server + "/api/health", {
            mode: "no-cors",
            cache: "no-store",
          });
          go();
        } catch {
          // server still down; try again shortly
        }
      }
      probe();
      setInterval(probe, 3000);
    </script>
  </body>
</html>
